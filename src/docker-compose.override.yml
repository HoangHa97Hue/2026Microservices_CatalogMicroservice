services:
  catalogdb:
    container_name: catalogdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CatalogDb
    restart: always
    ports:
      - "5432:5432" #the left 5432 is : we will redirecting the 5432 to our local environment
    volumes:
      - postgres_catalog:/var/lib/postgresql/data  
  # Persist PostgreSQL data in a Docker-managed named volume.
  # Removing/recreating the container keeps the data.
  # docker compose down -v removes the volume and its data.
# after defining the PostgresSQL override configuration, => should configure connection string in applicationsetting.json in catalog.API project

  basketdb:
    container_name: basketdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=BasketDb
    restart: always
    ports:
      - "5433:5432" #the left 5432 is : we will redirecting the 5432 to our local environment
    volumes:
      - postgres_basket:/var/lib/postgresql/data
  
  distributedcache:
    container_name: distributedcache
    restart: always # if any problem in the cache , it will restart automatically
    ports:
      - "6379:6379" #the left 6379 is : we will redirecting the 6379 to our local environment

  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;Include Error Detail=true # __ means this will be overwrite the current configuration (ConnectionStrings then Database) in the application setting
    ports:
      - "6000:8080"
      - "6060:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    depends_on:
      - catalogdb 

  basket.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=postgres;Include Error Detail=true  # basketdb lay theo the basketdb container name, mac du no co port 5433:5432 nhung trong container thi van la 5432 vi khac ten container db voi catalogdb nen khong bi conflict port 5432
      - ConnectionStrings__Redis=distributedcache:6379
      - ConnectionStrings__DiscountGrpc=discount.grpc:8081
    ports:
      - "6001:8080"
      - "6061:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    depends_on:
      - basketdb
      - distributedcache
  discount.grpc:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionString__Database= Data Source=discount.db   #add environment cho phan connection string nay  
    ports:
      - "6002:8080"
      - "6062:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
      - discount_data:/data    #Best practices for  Removing/recreating the container keeps the data.

     # /app  → có thể bị Visual Studio mount khi Debug
    #/data → Docker named volume riêng